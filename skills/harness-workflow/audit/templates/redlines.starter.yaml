# governance/redlines.yaml —— 本项目机器判据 starter（由 harness-workflow 审计引导生成）
#
# 作用：harness-workflow 的 audit/scripts/ 检查器从这里读"机器判据"
# （GOVERNANCE_DIR 指向本目录）。缺失时相关检查降级为软审（报告注明
# "无机器判据来源"）。本文件是起步模板：每一段都按项目实际调整；
# 调整属配置变更，建议由人确认后合入。
# 本文件是起步最小集而非权威策略；各段须按项目实际调整后使用。

schema_version: 1

# R-GOAL-001：契约的客观判定字段（成功判据/边界/范围表）不得出现这些模糊词
forbidden_words: [适当, 尽量, 等等, 大概, 合理, 关键, 重要, 必要时]

# 内容模式的路径范围用 skip_paths 黑名单：只按散文扩展名跳过（*.md/*.txt/*.rst），
# 其余一切文件（.sql/.go/.py/.rs/.kt/.cs/.scala/.swift/.xml/变更 yaml 等，含
# docs/ 目录下的代码与配置文件）全部扫描——白名单方式会漏检未列入的扩展名，
# 目录名跳过会让 docs/migrate.sql、docs/conf.py 这类文件成为绕过口（历史教训）。
# 确要跳过文档目录的散文，可加 "docs/**/*.md"。
# 匹配语义：只扫 diff 新增行、相邻新增行拼接折叠空白后扫描；diff 无文件头时保守全扫。
# 已知盲区（正则不可检出，靠人审与专业扫描器）：字符串/标识符拼接、运行时动态构造 SQL、
# 相邻新增行之间夹注释行（注释文本隔开两个半句）。
# R-RISK-001：从 diff 推算风险下限——命中的路径/模式一律按 high 对待（E-17）。
risk_patterns:
  - path_glob: "**/auth/**"          # 认证 / 权限（目录语义：不命中名为 auth 的文件）
  - path_glob: "**/payment/**"       # 支付 / 计费
  - path_glob: "**/migration/**"     # 数据迁移 / 删除
  - path_glob: "**/secrets/**"       # 密钥 / 凭据
  - pattern: '\b(GRANT|REVOKE)\b'    # 授权语句
    skip_paths: &not_prose ["**/*.md", "**/*.txt", "**/*.rst"]
  - pattern: '\b(ALTER|DROP)\s+TABLE\b|\bTRUNCATE\b'   # 不可逆 DDL
    skip_paths: *not_prose
  - pattern: '\bDELETE\s+FROM\b'     # 批量删除（无 WHERE 的全表删除正则分不出来，
    skip_paths: *not_prose           # 宁误报：命中后由人核 WHERE 条件）
  # 需要把某条模式收紧到指定路径时用 only_paths 白名单，例如：
  #   - pattern: '\bGRANT\b'
  #     only_paths: ["**/*.sql"]

# R-SEC-004：允许 AI 写入的路径（仅数据文件；单文件体积见 thresholds）。
# 注意：这是**目录前缀**而非 glob——"docs/" 匹配 docs/ 下所有文件；写 "docs/**"
# 或 "**/*.md" 会匹配不到任何文件（脚本会打 WARNING，见 check-ai-writable.py）。
# 允许的扩展名：md/json/yaml/yml/txt/csv。
ai_writable_paths:
  - "docs/"
  - "ai-reports/"

# static_risk_check（R-IMP-004/003）的可选配置段（均可省略；存在但非法 → 42）：
#   static_risk_allowlist：豁免正则列表——命中的行视为项目显式豁免（应经人审，E-06）
#   static_risk_extra_rules：追加规则正则列表——自研框架的自定义跳过 DSL 等
#   项目自有反模式从这里补（这是新增规则的唯一入口），命中即违规。例如：
# static_risk_extra_rules:
#   - '\bmyFramework\.pendingSkip\s*\('

thresholds:
  ai_writable_max_bytes: 65536       # AI 可写区单文件上限（64KB）

# —— 以下三类属"服务端强制"配套，首次审计可暂不设置（缺省时审计只做产物级检查）——
# required_rules:             # 采纳边界：声明哪些登记规则对本项目生效，审计按此出具合规结论；
#                             # 未设/为空 = 建议模式（报告为建议清单并明示"非合规判定"，退出码 0）。
#                             # 只能列 references/rule-registry.md 的 25 条登记规则；治理建设要求
#                             # （合入账号/预授权/凭据隔离等）不是登记表规则，见 attack-cases.md 设计要点。
#                             # 格式（YAML 列表，每条一个 mapping）：
#   - id: R-GOAL-001          # 登记表规则 ID
#     mechanism: script       # script | ci | manual
#     script: audit/scripts/check_contract.py   # mechanism=script 时必填
#     ci_step: check-contract # 可选
# protected_paths: []         # 禁止 AI 触碰、须人审的路径（如契约/governance/.github）
# review_required_paths: []   # 改动须人放行的路径（如鉴权/支付核心）
